type Todo @expose(listed: true) {
  id: ID!
  text: String!
  done: Boolean!
  user: User!
  isGlobal: Boolean @hide
}

type User @expose(listed: true) {
  id: ID!
  name: String!
}

input NewTodo @expose(listed: true) {
  text: String!
  userId: String!
  isGlobal: Boolean @hide
}

type Query {
  todos: [Todo!]! @expose(listed: true)
  internalQuery: Boolean!
}

type Mutation {
  createTodo(input: NewTodo!): Todo! @expose(listed: true)
  internalMutation: Boolean!
}
